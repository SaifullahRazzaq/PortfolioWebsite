# The site is a Next.js static export (output: 'export' in next.config.ts):
# `npm run build` writes plain files to out/, served as-is. No Next.js
# runtime or plugin is involved.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Matches "engines" in package.json.
  NODE_VERSION = "22"

# The generated share image is written without an extension; without this it
# is served as application/octet-stream and link previews drop it.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
